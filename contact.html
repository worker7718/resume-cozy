<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact | JCREATES</title>
    <meta
      name="description"
      content="Contact JCREATES for thoughtful website, design, and digital creative projects."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@500;600;700&family=Parisienne&display=swap"
      rel="stylesheet"
    >
    <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png?v=20260808-compact">
    <link rel="stylesheet" href="styles.css?v=20260810-contact-form-v1">
    <script src="script.js?v=20260810-contact-form-v1" defer></script>
  </head>
  <body class="contact-page">
    <header class="site-header" aria-label="Primary navigation">
      <a class="brand" href="/" aria-label="JCREATES home">
        <img
          class="brand-mark"
          src="assets/elodie-flower-logo.png"
          width="640"
          height="640"
          decoding="async"
          alt=""
        >
        <span class="brand-copy">
          <span class="brand-name">JCREATES</span>
          <span class="brand-role">Design &amp; Digital Creative</span>
        </span>
      </a>

      <nav class="main-nav" aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/work">Work</a>
        <a href="/resources">Resources</a>
        <a class="is-active" href="/contact" aria-current="page">Contact</a>
      </nav>

    </header>

    <main>
      <section class="contact-hero" aria-labelledby="contact-title">
        <img class="contact-botanical" src="assets/botanical-tape.png" alt="">
        <div class="contact-hero-copy">
          <p class="eyebrow">Contact</p>
          <h1 id="contact-title">Contact</h1>
        </div>

        <form class="contact-form" aria-label="Contact form" data-contact-form>
          <div class="contact-field">
            <label for="contact-name">Name</label>
            <input id="contact-name" name="name" type="text" autocomplete="name" required>
          </div>

          <div class="contact-field">
            <label for="contact-email">Email</label>
            <input id="contact-email" name="email" type="email" autocomplete="email" required>
          </div>

          <div class="contact-field">
            <label for="contact-project">Project type</label>
            <select id="contact-project" name="project">
              <option value="website">Website</option>
              <option value="creative-direction">Creative direction</option>
              <option value="digital-assets">Digital assets</option>
              <option value="other">Something else</option>
            </select>
          </div>

          <div class="contact-field">
            <label for="contact-message">Message</label>
            <textarea id="contact-message" name="message" rows="6" required></textarea>
          </div>

          <button class="contact-submit" type="submit">Send message</button>
          <p class="contact-form-status" role="status" aria-live="polite" data-contact-feedback hidden>
            Thanks. Your message details are ready.
          </p>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 JCREATES</p>
      <nav class="footer-links" aria-label="Footer navigation">
        <a href="/contact">Contact</a>
      </nav>
    </footer>

    <div class="music-widget" data-music-widget>
      <span class="music-label" id="music-label">Browsing Beats</span>
      <div class="music-control-row">
        <button
          class="music-volume music-volume-down"
          type="button"
          aria-label="Lower browsing beats volume"
          data-volume-action="down"
        >
          <span aria-hidden="true">&minus;</span>
        </button>
        <button
          class="music-toggle"
          type="button"
          aria-label="Play browsing beats"
          aria-describedby="music-label"
          aria-pressed="false"
          data-music-toggle
        >
          <span class="music-note" aria-hidden="true">&#9834;</span>
        </button>
        <button
          class="music-volume music-volume-up"
          type="button"
          aria-label="Raise browsing beats volume"
          data-volume-action="up"
        >
          <span aria-hidden="true">+</span>
        </button>
      </div>
      <audio data-music-player preload="none"></audio>
    </div>
  </body>
</html>
